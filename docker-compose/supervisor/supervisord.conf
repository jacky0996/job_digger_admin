; Supervisor:同 container 內同時跑 php-fpm 與 Laravel schedule:work
; 兩個都 critical(autostart + autorestart),任一掛掉 supervisor 會重起。
; 整個 supervisord 是 container 的 PID 1,被 docker stop 時會優雅地把 child 都收掉。

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; unix socket 給 supervisorctl 用(覆寫 main config 後必須自己提供)
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- PHP-FPM:處理來自 nginx 的 web 請求 ---
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT

; --- Laravel scheduler(Laravel 11 內建,取代傳統 cron) ---
; schedule:work 會在 foreground 每分鐘自動 schedule:run,
; 比傳統 cron 更乾淨,還能即時看 stdout 日誌。
[program:schedule]
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
priority=20
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; 這支會 long-run 一直跑,不該因為 startsecs 太短被誤判 fail
startsecs=10
