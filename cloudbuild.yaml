# Cloud Build pipeline for job_digger_admin (Laravel + Vite) → Cloud Run
#
# 觸發來源:Cloud Run continuous deployment (GitHub push to master)
# 編譯目標:Dockerfile.cloudrun (Node build + PHP-FPM + nginx)
# 部署目標:Cloud Run service `jobdigger-admin` @ asia-east1
#
# Cloud Run service 需另外手動設:
#   - env vars: APP_ENV=production, APP_DEBUG=false, APP_URL,
#               DB_CONNECTION=pgsql, DB_HOST=/cloudsql/<conn>, DB_PORT=5432,
#               DB_DATABASE=jobdigger_db, DB_USERNAME=jobdigger_user,
#               MIDDLE_PLATFORM_URL, SSO_JWT_ALGORITHM=RS256, SSO_JWKS_URL,
#               JOB_DIGGER_API_URL (= job-digger Cloud Run URL),
#               LOG_CHANNEL=stderr
#   - secrets: APP_KEY → jobdigger-admin-app-key, DB_PASSWORD → jobdigger-db-password
#   - Cloud SQL connection: middleplatform-496708:asia-east1:portfolio

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.cloudrun
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}']
  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --quiet

substitutions:
  _REGION: asia-east1
  _SERVICE: jobdigger-admin
  _AR_REPO: cloud-run-source-deploy

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # Laravel + Vite + composer 一起,給大機器
