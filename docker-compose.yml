services:
  # PHP-FPM 應用容器
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-digger-admin-image
    container_name: job_digger_admin_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei
      # 走 job-digger compose 內部 network,直接用 service name
      # (改用 docker network 而非 host.docker.internal:Mac DD 的 host-gateway 走 IPv6
      #  會跟 host port 的 IPv4 bind 對不上,導致 timeout)
      DB_CONNECTION: pgsql
      DB_HOST: job_db
      DB_PORT: "5432"
    networks:
      - admin-net
      - job-digger-net

  # Nginx 反向代理 + 靜態檔
  nginx:
    image: nginx:alpine
    container_name: job_digger_admin_nginx
    restart: unless-stopped
    ports:
      # Host 8084 → container 80
      # (80 給中台,81 給 EDM-BE,82 給 EDM-FE,85 給 job-digger;
      #  原本想用 84 但被 macOS / Docker Desktop 內部 reserve,改用 8084)
      - "8084:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    environment:
      TZ: Asia/Taipei
    networks:
      - admin-net

networks:
  admin-net:
    driver: bridge
  # job-digger compose 起來時自動建的 default network
  # (admin 跨進去後可以用 service name 找 scraper-api / job_db)
  # 雲端不需要這段,直接用 Cloud Run URL
  job-digger-net:
    name: job-digger_default
    external: true
