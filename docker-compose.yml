services:
  # PHP-FPM 應用容器
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-digger-admin-image
    container_name: job_digger_admin_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei
      # 連到 host 上 job-digger 的 PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: "5434"
    extra_hosts:
      # 讓容器內可以透過 host.docker.internal 連到 host(macOS / Linux)
      - "host.docker.internal:host-gateway"
    networks:
      - admin-net

  # Nginx 反向代理 + 靜態檔
  nginx:
    image: nginx:alpine
    container_name: job_digger_admin_nginx
    restart: unless-stopped
    ports:
      # Host 8084 → container 80
      # (80 給中台,81 給 EDM-BE,82 給 EDM-FE,85 給 job-digger;
      #  原本想用 84 但被 macOS / Docker Desktop 內部 reserve,改用 8084)
      - "8084:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    environment:
      TZ: Asia/Taipei
    networks:
      - admin-net

networks:
  admin-net:
    driver: bridge
